- url: https://www.parliament.go.th/section77/ajax/pagination.php?page=1&type=12
  start_urls:
  - https://www.parliament.go.th/section77/ajax/pagination.php?page=1&type=11
  - https://www.parliament.go.th/section77/ajax/pagination.php?page=1&type=22
  - https://www.parliament.go.th/section77/ajax/pagination.php?page=1&type=21
  item_base_url: https://www.parliament.go.th/section77/
  mode: html
  link_selector: .title_discussion a[href]
  item_selector: .item-77
  max_pages: 4
  include_url: survey_detail
  limitations:
  - Observed public AJAX first page for four consultation categories. Consultation
    windows and changing vote/view counters are not publication dates or content revisions.
  id: house-section-77-discovery
  enabled: true
  validation_status: candidate
  fixture: tests/fixtures/repairs/main-house-section-77-discovery.html
  fixture_kind: representative-official-extract
- url: https://prt.parliament.go.th/server/api/discover/search/objects?sort=dc.date.accessioned,DESC&size=20
  mode: json
  json_rows: _embedded.searchResult._embedded.objects
  json_fields:
    title: _embedded.indexableObject.name
    url: _links.indexableObject.href
    document_id: _embedded.indexableObject.uuid
    published_at: /_embedded/indexableObject/metadata/dc.date.issued/0/value
    modified_at: _embedded.indexableObject.lastModified
  include_url: null
  limitations:
  - Public DSpace search API, latest20 accessions. Item links are official public
    metadata endpoints. Issued dates retained as raw source values when only month/year;
    accession date is never publication date. Historical documents newly accessioned
    are not new laws.
  id: parliament-repository-discovery
  enabled: true
  validation_status: candidate
  fixture: tests/fixtures/repairs/main-parliament-repository-discovery.json
  fixture_kind: representative-official-extract
- mode: json-script
  json_script_selector: script#__NEXT_DATA__
  json_rows: props.pageProps.result.rows
  json_fields:
    title: p_name
    document_id: p_id
    modified_at: p_last_update_date
  url_template: https://einitiative.parliament.go.th/draftlaw-detail?id={p_id}&name={p_name}
  date_calendar: buddhist
  include_url: null
  limitations:
  - Initial server-rendered eight draft records only, parsed as inert JSON; public
    reader route verified from frontend JS. Explicit BE last-update timestamp normalized,
    never called publication date. No voting, login or personal-information fields
    collected.
  id: parliament-einitiative-discovery
  enabled: true
  validation_status: candidate
  fixture: tests/fixtures/repairs/main-parliament-einitiative-discovery.html
  fixture_kind: representative-official-extract
- id: council-of-state-discovery
  url: https://www.ocs.go.th/indexs/block/8?mode=frontend&screen=auto
  allowed_hosts:
  - www.ocs.go.th
  - law.go.th
  mode: html
  enabled: true
  validation_status: candidate
  title: OCS official law-news (partial discovery coverage)
  link_selector: a[aria-label="gotocontent"][href]
  item_selector: a[aria-label="gotocontent"]
  title_selector: span[title]
  title_attribute: title
  tls_intermediates:
    www.ocs.go.th: config/tls/globalsign-rsa-ov-2018.pem
  fixture: tests/fixtures/repairs/main-ocs-news.html
  fixture_kind: representative-official-extract
  limitations:
  - Official law-news block is partial discovery coverage, not the SearchLaw corpus.
    Legacy krisdika presents an unsafe self-signed certificate and is not trusted.
    OCS missing intermediate validated to existing roots; no TLS verification bypass.
    No dates inferred; view counters excluded.
