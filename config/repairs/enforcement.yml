sources:
- id: amlo-listing-01
  url: https://www.amlo.go.th/index.php/th/
  enabled: true
  validation_status: verified
  public_form: {intro_page: '1'}
  public_form_url: https://www.amlo.go.th/index.php/th/
  mode: html
  link_selector: '.title-hilight2f a[href], .home-boxthumbnailnews2f a[href]'
  item_selector: '.title-hilight2f, .home-boxthumbnailnews2f'
  title_selector: '.title-caption, :scope > a:not(:has(.title-caption))'
  include_url: '/index\.php/news/detail/\d+$'
  fixture: tests/fixtures/repairs/enforcement-amlo-home.html
  fixture_kind: representative-official-extract
  limitations:
  - 'Public intro form POST intro_page=1 required; no cookies or authentication. Homepage headlines/recent cards only:5 unique publications. Split day/month dates remain unknown. Form contract and robots/TLS checks must pass before POST; this is not full AMLO archive coverage.'
- id: amlo-listing-02
