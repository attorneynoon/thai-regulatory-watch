- id: ocpb-home
  url: https://www.ocpb.go.th/index.php?filename=index
  enabled: true
  validation_status: verified
  link_selector: '.align-items-stretch > a[href*="news_view.php?nid="]'
  item_selector: .align-items-stretch
  title_selector: .h-news-index
  date_selector: 'p.view-index-list:has(.fa-calendar-alt)'
  date_pattern: '^\s*(\d{1,2}\s+[ก-๙.]+\s+\d{4})\s*(?:\||$)'
  include_url: 'news_view\.php\?nid='
  fixture: tests/fixtures/repairs/enforcement-ocpb-home.html
  fixture_kind: representative-official-extract
  limitations:
  - Official intro page links to this homepage. Only publication cards selected; menus and counts excluded from titles. Homepage highlights only; date_pattern excludes adjacent view counts before date parsing.
- id: ocpb-listing-01
  url: https://www.ocpb.go.th/more_news.php?cid=2
  enabled: true
  validation_status: verified
  link_selector: '.blog-item-news h5 a[href]'
  item_selector: .blog-item-news
  date_selector: 'p:has(.fa-calendar)'
  date_pattern: '^\s*(\d{1,2}\s+[ก-๙.]+\s+\d{4})\s*(?:\||$)'
  include_url: 'news_view(?:_en)?\.php\?nid='
  fixture: tests/fixtures/repairs/enforcement-ocpb-news.html
  fixture_kind: representative-official-extract
  limitations:
  - Required category2 discovered from homepage; first9 news cards only. Site uses news_view_en.php for Thai titles; preserve exact links. date_pattern isolates displayed date and excludes changing view counts.
