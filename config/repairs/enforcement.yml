  - Official AEM endpoint derived from public component model and JavaScript; first20 results only. The default-year path contains2569 and requires review at year rollover. No completeness claim.
- id: customs-listing-01
  enabled: true
  validation_status: verified
  link_selector: '.panel-news a[href]'
  include_url: 'cont_strc_simple_with_date\.php\?current_id='
