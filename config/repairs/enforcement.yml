- id: ncsa-listing-01
  url: https://www.ncsa.or.th/data/output/news.json
  enabled: true
  validation_status: verified
  mode: json
  max_response_bytes: 32000000
  json_rows: ''
  json_fields: {title: title, published_at: showdate, document_id: _id}
  json_filter: {_state: 1}
  json_contains: {category: announcement}
  json_sort: {field: showdate, descending: true}
  url_template: https://www.ncsa.or.th/news/{_id}
  fixture: tests/fixtures/repairs/enforcement-ncsa.json
  fixture_kind: representative-official-extract
  limitations:
  - Client-rendered announcements replaced by public export filtered to published announcement category.27.5MB payload bounded at32MB; sort before100-item cap. Dates use explicit showdate, never database-created timestamp.
- id: ncsa-listing-02
  url: https://www.ncsa.or.th/data/output/news.json
