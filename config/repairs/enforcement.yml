- id: dbd-listing-01
  enabled: true
  validation_status: verified
  mode: json
  json_rows: data.result
  json_fields: {title: title, published_at: rawDate, document_id: id}
  url_template: https://www.dbd.go.th/news/{slug}
  fixture: tests/fixtures/repairs/enforcement-dbd.json
  fixture_kind: representative-official-extract
  limitations:
  - Existing category is the English Press Release category, not complete Thai DBD news. API returns12 rows despite requested limit25 and total13. First page only; public frontend confirms news/slug route.
- id: dip-listing-01
  url: https://webnew.ipthailand.go.th/wp-json/wp/v2/news?per_page=20&orderby=date&order=desc&_fields=id,date,modified,link,title
  enabled: true
  validation_status: verified
  mode: json
  json_rows: ''
  json_fields: {title: title.rendered, url: link, published_at: date, modified_at: modified, document_id: id}
  exclude_title: 'จัดซื้อ|จัดจ้าง|ประกวดราคา|รับสมัคร|สมัครสอบ|ผู้ชนะการเสนอราคา'
  fixture: tests/fixtures/repairs/enforcement-dip.json
  fixture_kind: representative-official-extract
  limitations:
  - Official WordPress news custom-post route linked by type metadata.20 most recent rows before procurement/recruitment exclusions; no archive completeness claim. General RSS rejected because it contains organization/procurement posts rather than this news type.
