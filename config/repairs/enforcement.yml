- id: thaibma-listing-01
  enabled: true
  validation_status: verified
  max_items: 300
  link_selector: 'tr a[href*="/pdf/"]'
  item_selector: tr
  title_selector: 'td[class]'
  exclude_title: '^•?\s*พ\.ศ\.\s*\d+\s*$|จัดซื้อ|จัดจ้าง|ประกวดราคา|รับสมัครงาน|สมัครสอบ'
  fixture: tests/fixtures/repairs/enforcement-thaibma.html
  fixture_kind: representative-official-extract
  limitations:
  - Rule-document table labels resolve image-only PDF links;115 PDFs with cap300; one year-only row label excluded. Amendment links retain full parent rule text and amendment context. Includes historical and repealed entries; legal applicability Not assessed. No publication date inferred from filenames or titles.
