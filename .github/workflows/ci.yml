name: Validate
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'state/**', 'reports/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m regwatch validate
      - run: python -m regwatch build
      - run: python -m regwatch check
      - name: Deterministic rebuild
        run: |
          find site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/before.sha256
          python -m regwatch build
          find site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/after.sha256
          diff /tmp/before.sha256 /tmp/after.sha256
  tcct-api-qualification:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/tcct-api-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: tcct-read-only-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt
      - name: Qualify TCCT listings with disposable in-memory state
        shell: bash
        run: |
          set -o pipefail
          python scripts/qualify_tcct_live.py --diagnose-taxonomy | tee "$RUNNER_TEMP/tcct-api-qualification.json"
      - name: Confirm protected files were not changed
        if: always()
        run: git diff --exit-code -- state/ site/ schemas/ config/
