name: Validate
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'state/**', 'reports/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m regwatch validate
      - run: python -m regwatch build
      - run: python -m regwatch check
      - name: Deterministic rebuild
        run: |
          find site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/before.sha256
          python -m regwatch build
          find site -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/after.sha256
          diff /tmp/before.sha256 /tmp/after.sha256
