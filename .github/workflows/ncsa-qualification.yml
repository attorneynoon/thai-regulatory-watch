name: NCSA read-only qualification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ncsa-qualification.yml'
      - 'scripts/qualify_ncsa.py'
      - 'config/sources.yml'
      - 'regwatch/**'
      - 'requirements.txt'
      - 'tests/test_ncsa_qualification.py'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt
      - name: Record checked revision
        run: git rev-parse HEAD
      - name: Record protected-file baseline
        id: baseline
        shell: bash
        run: |
          find state site schemas config/sources.yml -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/ncsa-before.sha256"
          sha256sum state/monitor.json "$RUNNER_TEMP/ncsa-before.sha256"
          wc -l "$RUNNER_TEMP/ncsa-before.sha256"
      - name: Qualify all three NCSA scopes in memory
        id: qualification
        run: python scripts/qualify_ncsa.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Verify protected files after qualification
        id: verify
        if: ${{ always() && steps.baseline.outcome == 'success' }}
        shell: bash
        run: |
          find state site schemas config/sources.yml -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/ncsa-after.sha256"
          diff --unified "$RUNNER_TEMP/ncsa-before.sha256" "$RUNNER_TEMP/ncsa-after.sha256"
          sha256sum state/monitor.json "$RUNNER_TEMP/ncsa-after.sha256"
          wc -l "$RUNNER_TEMP/ncsa-after.sha256"
          printf 'protected_files_unchanged=true\n'
