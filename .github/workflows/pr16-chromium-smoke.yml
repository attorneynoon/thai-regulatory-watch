name: PR16 Chromium Ubuntu 24.04

on:
  push:
    branches: [test/pr16-chromium-2404]

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f62f31270e3d8ba407e19e1a15ec674209e1e882
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify target and operating system
        run: |
          test "$(git rev-parse HEAD)" = \
            f62f31270e3d8ba407e19e1a15ec674209e1e882
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -m)" = x86_64
          cat /etc/os-release
          python --version

      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Launch Chromium and verify rendering
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from playwright.sync_api import sync_playwright

          assert version("playwright") == "1.55.0"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<h1>Chromium ready</h1>")
              assert page.locator("h1").inner_text() == "Chromium ready"
              assert page.evaluate("1 + 1") == 2
              print("PASS: Chromium launch, DOM and JavaScript")
              print("Chromium version:", browser.version)
              browser.close()
          PY

      - run: python -m unittest discover -s tests -v
      - run: python -m regwatch validate

      - name: Verify tracked files remain unchanged
        run: git diff --exit-code HEAD --
