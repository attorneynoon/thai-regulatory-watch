name: Rendered source qualification
on:
  pull_request:
    paths: ['scripts/probe_rendered_sources.py', 'scripts/probe_pdpc_alternates.py', 'regwatch/browser_transport.py', 'config/sources.yml', '.github/workflows/rendered-source-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/probe_rendered_sources.py
        env:
          PYTHONIOENCODING: utf-8
      - run: python scripts/probe_pdpc_alternates.py
        env:
          PYTHONIOENCODING: utf-8
