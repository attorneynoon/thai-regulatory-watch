name: AMLO and DIP read-only source-contract qualification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/source-contract-qualification.yml'
      - 'scripts/probe_source_contracts.py'
      - 'tests/test_source_contracts.py'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt
      - name: Test diagnostics offline
        run: python -m unittest discover -s tests -p test_source_contracts.py -v
      - name: Inspect official public GET endpoints
        run: python scripts/probe_source_contracts.py
        env:
          PYTHONIOENCODING: utf-8
          PYTHONDONTWRITEBYTECODE: '1'
