name: TCCT Public Gemini Smoke

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcct-public-gemini-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'run-public-gemini-smoke' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: tcct-public-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out review candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install bounded fixture tooling
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Build one-page public scanned fixture
        run: python prototypes/tcct-ocr-deep-analysis-v0.2/scripts/build-public-fixture.py

      - name: Run public Gemini smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node prototypes/tcct-ocr-deep-analysis-v0.2/scripts/public-smoke.mjs

      - name: Print smoke report
        if: always()
        run: |
          if [[ -f prototypes/tcct-ocr-deep-analysis-v0.2/smoke-output/smoke-report.md ]]; then
            cat prototypes/tcct-ocr-deep-analysis-v0.2/smoke-output/smoke-report.md
          else
            echo 'Smoke report was not created.'
          fi

      - name: Upload review-only smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcct-public-gemini-smoke
          path: prototypes/tcct-ocr-deep-analysis-v0.2/smoke-output
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce smoke result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('prototypes/tcct-ocr-deep-analysis-v0.2/smoke-output/smoke-report.json')
          if not report.exists():
              raise SystemExit('Smoke report missing')
          status = json.loads(report.read_text(encoding='utf-8')).get('status')
          print(f'SMOKE_STATUS={status}')
          if status != 'PASS':
              raise SystemExit(f'Public Gemini smoke did not pass: {status}')
          PY
