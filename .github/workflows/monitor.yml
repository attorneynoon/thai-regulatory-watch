name: Regulatory Watch
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regulatory-watch-writer
  cancel-in-progress: false
env:
  FEED_BASE_URL: ${{ vars.FEED_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m regwatch validate
      - run: python -m regwatch collect --allow-source-errors
      - run: python -m regwatch check
      - name: Preserve collected public state and outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/ site/ schemas/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update regulatory observations and source health'
            git push origin HEAD:main
          fi
      - name: Upload generated site
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          retention-days: 1
  health:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m regwatch health
  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy feeds and dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
